name: CD (Deploy via EAS)

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}

jobs:
  check-ci-passed:
    name: Check CI Passed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - id: check
        run: echo "should_deploy=true" >> $GITHUB_OUTPUT

  deploy-eas-update:
    name: Deploy via EAS Update
    runs-on: ubuntu-latest
    needs: check-ci-passed
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Write Verdaccio .npmrc
        run: |
          echo "@soostori:registry=https://registry.nextmavens.com/" > .npmrc
          echo "//registry.nextmavens.com/:_authToken=${{ secrets.VERDACCIO_AUTH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Expo credentials
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN secret is missing or empty. Add it in GitHub repo settings."
            exit 1
          fi

          if [ -z "${EXPO_PROJECT_ID}" ]; then
            echo "EXPO_PROJECT_ID is missing. Set either the repo secret or repo variable."
            echo "Get it from Expo Dashboard → Project Settings → Project ID"
            exit 1
          fi

      - name: Create EAS Update (development channel)
        run: |
          npx eas-cli@latest update --non-interactive --channel development --message "Auto-deploy: ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-eas-update
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: soostori-mobile-debug-apk
          path: dist
        continue-on-error: true

      - name: Generate checksum (if APK exists)
        run: |
          if [ -f dist/*.apk ]; then
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          tag_name: mobile-${{ github.sha }}
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
